<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <title>Nested Grid</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
/*      display: flex;*/
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #f0ece4;
    }

    /* ── Outer grid: 3×3 of square cells ── */
    .outer-grid {
      display: grid;
      grid-template-columns: repeat(3, 180px);
      grid-template-rows:    repeat(3, 180px);
      gap: 0;
    }

    /* Every outer cell is relatively positioned */
    .cell {
      position: relative;
      background: #1a1a2e;
      overflow: hidden;

      /* Inner grid fills the cell */
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows:    repeat(3, 1fr);
      gap: 0;
    }

    /* ── Inner cells ── */
    .inner-cell {
      position: relative;
      background: #16213e;
      border-right:1px dashed rgba(255,255,255,.1);
      border-bottom:1px dashed rgba(255,255,255,.1);
    }
    .curvebox1, .curvebox2, .curvebox3, .curvebox4 {
      position: absolute;
      height:100%;
      width:100%;
      display:flex;
    }
    /*.curvebox2, .curvebox3 {
      top:-100%;
      transform: rotate(90deg);
    }
    .curvebox3 {
      top:-200%;
    }
    .curvebox4 {
      top:-300%;
    }*/
    /* The absolutely-centred 5 px bar inside every inner cell */
    .inner-cell .bar-h,  .inner-cell .bar-hl, .inner-cell .bar-hr,
    .inner-cell .bar-vt, .inner-cell .bar-vb, 
    .inner-cell .bar-tb,  .inner-cell .bar-bt, 
    .inner-cell .label-place,
    .inner-cell .label-stop,
    .inner-cell .label-bus   {
      position: absolute;
      top:    50%;
      left:   0;
      transform: translateY(-50%);
      width:  100%;
      height: 4px;
      border: 2px dashed #e94560;
    }
    .inner-cell .label-place,
    .inner-cell .label-stop,
    .inner-cell .label-bus {
      width:4px;
      height:4px;
      border: 1px dashed #16213e;
      display: none;
    }
    .inner-cell .bar-vt, .inner-cell .bar-vb {
      transform: rotate(90deg);
      margin-top: 0;
      width: 50%;
      top: 13px;
      left: 25%;

    }
    .inner-cell .bar-vb {
      top:unset;
      bottom: 12px;

    }
    .inner-cell .bar-tb {
      transform: rotate(45deg);
      border: 2px dashed gold;
      top: 26px;
      left: -14px;
      width: 84px;
    }
    .inner-cell .bar-bt {
      transform: rotate(135deg);
      border: 2px dashed cyan;
      top: 27px;
      left: -14px;
      width: 84px;
    }
    .curve1, .curve2, .curve3, .curve4 {
      position: absolute;
      width: 30px;
      height: 30px;
      background: transparent;
      border-top: 3px dashed #e94560;
      border-right: 3px dashed #e94560;
      border-bottom: none;
      border-left: none;
      border-radius: 0 100% 0 0;
      transform: translate(-50%, -50%);
      top: 43px;
      right: -25%;
    }
  .curvebox1 .curve1, .curvebox2 .curve1 {
    top: 1px;
    right: unset;
    left: 0;
    transform: rotate(180deg);
  }

  .curvebox1 .curve2, .curvebox2 .curve2 {
    top: 1px;
    right: 0;
    transform: rotate(90deg);
  }

  .curvebox1 .curve3, .curvebox2 .curve3 {
    top: 28px;
    right: 50%;
    transform: rotate(270deg);
  }

  .curvebox1 .curve4, .curvebox2 .curve4 {
    top: 43px;
    right: -25%;

  }

  .curvebox3 * {
    border-color:#e94560;
  }

  .curvebox3 .curve1 {
    top: 28px;
    right: 50%;
    transform: rotate(0deg);
  }

  .curvebox3 .curve2 {
    top: 0px;
    right: 29px;
    transform: rotate(90deg);
    margin-right: 0px;
    height: 32px;
  }

 .curvebox3 .curve3 {
    top: 28px;
    right: unset;
    left: 28px;
    transform: rotate(270deg);
  }

  .curvebox3 .curve4 {
    top: 1px;
    right: 0;
    transform: rotate(180deg);
  }

  .curvebox4 * {
  border-color:gray;
}
  .curvebox4 .curve1 {
    top: 0;
    right: 50%;
    transform: scaleX(-1);
  }

  .curvebox4 .curve2 {
    top: 0px;
    right: 0;
    transform: rotate(360deg);
  }

 .curvebox4 .curve3 {
    top: 29px;
    right: unset;
    left: 0;
    transform: rotate(180deg);
  }

  .curvebox4 .curve4 {
    top: 29px;
    right: 0;
    transform: rotate(90deg);
  }

  .bar-tl,
  .bar-tr,
  .bar-rt,
  .bar-rb,
  .bar-br,
  .bar-bl,
  .bar-lb,
  .bar-lt,
  .bar-lv {
    height:50%;
    width:50%;
    position:absolute;
    border-top:3px dashed white;
    z-index:99;
    left:0;
    top:0;
  }
  .bar-tl {
/*    margin-top:-1px;*/
  }
  .bar-tr {
    left:50%;
/*    margin-top:-1px;*/
  }
  .bar-rt,
  .bar-lv {
    left: unset;
    right: 0;
    transform: rotate(90deg);
/*    margin-right: -1px;*/

  }
  .bar-rb {
    left: unset;
    right: 0;
    transform: rotate(90deg);
    top:unset;
    bottom:0;
/*    margin-right: -1px;*/

  }
  .bar-br {
    left:50%;
    top:100%;

  }
  .bar-bl {
    top:100%;

  }
  .bar-lv {
    width:100%;
    height:100%;
  }
  .bar-lb {
    transform: rotate(90deg);
    top: unset;
    bottom: 0;
    left: -50%;
/*    margin-left: 1px;*/

  }
  .bar-lt {
    transform: rotate(90deg);
    left: -50%;
/*    margin-left: 1px;*/
  }
  .bar-hl {
    width:50% !important;
  }
  .bar-hr {
    width:50% !important;
    left:unset !important;
    right:0;
  }

.label-town-centre {
