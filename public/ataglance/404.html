<style type="text/css">
@-webkit-keyframes swing
{
    15%    {
        -webkit-transform: translateX(5px);
        transform: translateX(5px);
    }
    30%    {
        -webkit-transform: translateX(-5px);
       transform: translateX(-5px);
    } 
    50%    {
        -webkit-transform: translateX(3px);
        transform: translateX(3px);
    }
    65%    {
        -webkit-transform: translateX(-3px);
        transform: translateX(-3px);
    }
    80%    {
        -webkit-transform: translateX(2px);
        transform: translateX(2px);
    }
    100%    {
        -webkit-transform: translateX(0);
        transform: translateX(0);
    }
}
@keyframes swing
{
    15%    {
        -webkit-transform: translateX(5px);
        transform: translateX(5px);
    }
    30%    {
        -webkit-transform: translateX(-5px);
        transform: translateX(-5px);
    }
    50%    {
        -webkit-transform: translateX(3px);
        transform: translateX(3px);
    }
    65%    {
        -webkit-transform: translateX(-3px);
        transform: translateX(-3px);
    }
    80%    {
        -webkit-transform: translateX(2px);
        transform: translateX(2px);
    }
    100%    {
        -webkit-transform: translateX(0);
        transform: translateX(0);
    }
}
.swing:hover
{
        -webkit-animation: swing .5s ease;
        animation: swing .5s ease;
        -webkit-animation-iteration-count: 1;
        animation-iteration-count: 1;
}

.aligner {
  display: flex;
  align-items: center;
  justify-content: center;
}

.aligner-item {
  max-width: 50%;
}

.clip-circle {
    height: 330px;
    width: 100%;
    max-width:800px;
    border-radius: 50%;
    overflow: hidden;
    margin: 25px auto 0;
    border-top: 15px inset rgba(0,0,0,.25);
}

.eye {
    width: 100%;
    height: 330px;
    border-radius: 100%;
    position: relative;
    background: radial-gradient(circle at 50%, #fcfcfc, #efeff1 66%, #eecccc 100%);
}

.iris {
width: 50%;
    max-width: 200px;
    height: 200px;
    border-radius: 100%;
    position: absolute;
    left: 0;
    top: 0;
    margin: 80px 25% 0;
  animation: move 5s ease-out infinite;
  background: radial-gradient(circle at 50% 50%, #066 0%, #6cc 90%);
}

.iris:before {
  content: "";
  width: 40%;
  height: 40%;
  border-radius: 100%;
  position: absolute;
  left: 50%;
  top: 50%;
  background: black;
  transform: translate(-50%, -50%);
}

.iris:after {
  content: "";
  width: 30%;
  height: 30%;
  border-radius: 100%;
  position: absolute;
  left: 20%;
  top: 20%;
  background: rgba(255, 255, 255, 0.2);
}

#lid {
  animation: blink 2.4s infinite;
  animation-delay: 8s;
  top: -50px;
    border-bottom:15px inset rgba(0,0,0,.9);
}

@keyframes move {
  0% {
    transform: none;
  }
  20% {
    transform: translateX(-35%) translateY(10%) scale(0.95);
  }
  30%, 40% {
    transform: none;
  }
  50%, 60% {
    transform: translateX(35%) translateY(-15%) scale(0.95);
  }
  66%, 100% {
    transform: none;
  }
}
@keyframes blink {

  90% {
    transform: none;
    animation-timing-function: ease-in;
  }
  93% {
    transform: translateY(15px) scaleY(0)
  }
  100% {
    animation-timing-function: ease-out;
  }
}

@media screen and (min-width:600px) {

.clip-circle {
    height: 400px;
    margin: 25px auto 0;
}

.eye {
    height: 400px;
}

.iris {
    max-width: 300px;
    height: 66.6%;
    left: 0;
    top: 0;
    margin: 65px 35%;
}

}
@media screen and (min-width:600px) {

.iris {
    height: 75%;
    margin: 65px 32%;
}

}
